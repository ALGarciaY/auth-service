      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: localhost
    port: 5433
    database: crediya
    username: leo
    password: pragmaleo123
    schema: public
security:
  jwt:
    secret: ${JWT_SECRET:change-me-very-long-32+chars}
    expiration-sec: 36000 # 1 hora
    issuer: https://auth-service        # el 'iss' que pondrás en los tokens
    audience: loan-service              # 'aud' que validará el loan-service