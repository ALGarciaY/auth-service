server:
  port: 8081

spring:
  application:
    name: "auth-service"

  devtools:
    add-properties: false

  #flyway:   # Opcional, solo si quieres manejar migraciones de base de datos
  #  enabled: true
  #  url: jdbc:postgresql://localhost:5432/mi_basedatos
